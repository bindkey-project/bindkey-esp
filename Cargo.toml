[package]
name = "bindkey-esp"
version = "0.1.0"
authors = ["ouiyamcode <williaminiziato54@gmail.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.77"

[[bin]]
name = "bindkey-esp"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[features]
default = []

experimental = ["esp-idf-svc/experimental"]

[dependencies]
log = "0.4"
esp-idf-svc = "0.51"
esp-idf-sys = { version = "0.36", features = ["native"] }

[build-dependencies]
embuild = "0.33"

[package.metadata.esp-idf-sys]

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["src/usb_mass_storage/usb_host_msc"]
bindings_header = "src/usb_mass_storage/usb_host_msc/bindings.h"
bindings_module = "usb_msc"
bindings_include_dirs = [
    "src/usb_mass_storage/usb_host_msc/include",
    "src/usb_mass_storage/usb_host_msc/include/usb",
    "src/usb_mass_storage/usb_host_msc/private_include"
]

